[package]
name = "helper_lib"
version = "0.3.0"
edition = "2024"

[lib]
doctest = false

[features]
default = ["log"]
# default = ["log", "turso"]
log = ["dep:dirs", "dep:log", "dep:simplelog", "dep:time"]
asyncs = ["dep:tokio"]
clipboard = ["dep:arboard"]
config = ["dep:dirs", "dep:serde_core", "dep:toml"]
crypto = ["dep:aes-gcm"]
datetime = ["dep:chrono"]
llm = ["dep:anyhow", "dep:base64", "dep:nalgebra", "dep:reqwest", "dep:serde_json"]
markdown = ["dep:anyhow", "dep:html-to-markdown-rs"]
paths = ["dep:dirs", "dep:sha2", "dep:flate2"]
quitter = ["dep:crossterm", "dep:termios"]
regex = ["dep:regex"]
rusqlite = ["sql", "dep:anyhow", "dep:rusqlite"]
sql = ["dep:anyhow", "dep:chrono", "dep:hex", "dep:zstd"]
turso = ["sql", "dep:turso", "dep:tokio"]
all = ["log", "asyncs", "clipboard", "config", "crypto", "datetime", "llm", "markdown", "paths", "quitter", "regex", "rusqlite", "sql", "turso"]

[dependencies]
aes-gcm = { version = "0.11", optional = true }
anyhow = { version = "1", optional = true }
arboard = { version = "3", optional = true }
base64 = { version = "0.23", optional = true }
chrono = { version = "0.4", optional = true }
dirs = { version = "7", optional = true }
flate2 = { version = "1", optional = true }
hex = { version = "0.4", optional = true }
html-to-markdown-rs = { version = "3", optional = true }
log = { version = "0.4", optional = true }
nalgebra = { version = "0.35", optional = true }
regex = { version = "1", optional = true }
reqwest = { version = "0.13", optional = true }
rusqlite = { version = "0.43", features = ["bundled", "chrono"], optional = true }
serde_core = { version = "1", optional = true }
serde_json = { version = "1", optional = true }
sha2 = { version = "0.11", optional = true }
simplelog = { version = "0.12", optional = true }
time = { version = "0.3", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
toml = { version = "1", optional = true }
turso = { version = "0.8", optional = true }
zstd = { version = "0.14", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
termios = { version = "0.3", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
crossterm = { version = "0.29", optional = true }

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
